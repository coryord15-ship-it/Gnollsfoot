name: Build GnollGuard.exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # lets you trigger a build by hand from the Actions tab

permissions:
  contents: write      # needed to publish the release + upload the .exe

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # build_data/ is gitignored (this repo is public), so a CI checkout has none -- which
      # meant NO shipped release ever contained the item/mob/exaltation snapshots and every
      # new user got "Reference data not found" on Gear and Codex. Verified absent in the live
      # 1.5.31 binary. Pulling them here also means each build ships CURRENT data instead of
      # whatever happened to be on the maintainer's disk.
      #
      # No secret needed: it reads with the PUBLISHABLE key that is already hardcoded in
      # app/main.py and ships inside every binary. The script refuses a service_role key, and
      # fails the build if a snapshot comes back nearly empty rather than shipping a lie.
      - name: Fetch reference snapshots
        run: python tools/build_snapshots.py

      - name: Build GnollGuard.exe
        run: pyinstaller GnollGuard.spec --clean --noconfirm

      - name: Read version
        id: ver
        run: |
          $v = python -c "from app.version import __version__; print(__version__)"
          echo "version=$v" >> $env:GITHUB_OUTPUT

      # ── Guard: the tag MUST match app/version.py ───────────────────────────────
      # On 2026-08-03 we found that v1.5.15 AND v1.5.16 were both built from commit
      # ee4b55c, where version.py still said 1.5.13. Checkout takes the TAGGED
      # COMMIT, but the release is published under github.ref_name — so a tag
      # pushed at a stale commit ships an OLD BUILD UNDER A NEW VERSION NUMBER.
      #
      # It failed silently and completely: users installed "1.5.16", the app
      # reported 1.5.13, the updater offered 1.5.16 again, forever. Two whole
      # releases reached nobody.
      #
      # The build must not be able to lie about its own version again.
      - name: Verify tag matches app/version.py
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          $src = "${{ steps.ver.outputs.version }}"
          if ($tag -ne $src) {
            Write-Host "::error::Tag v$tag does not match app/version.py ($src)."
            Write-Host "::error::You almost certainly tagged a commit that predates the version bump."
            Write-Host "::error::Commit the bump, then re-tag that commit. Refusing to publish."
            exit 1
          }
          Write-Host "OK - tag v$tag matches app/version.py ($src)"

      - name: Ensure Inno Setup is installed
        run: choco install innosetup --no-progress -y

      - name: Build GnollGuard-Setup.exe (Inno Setup installer)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} /Q installer\GnollGuard.iss

      # A zipped copy of the installer, for users whose ISP or antivirus blocks
      # .exe downloads outright (Comcast/Xfinity web protection was reported on
      # 2026-08-04). Those filters generally pass .zip untouched. The real fix is
      # code signing; this is the free workaround until that happens.
      #
      # The site links to it as GnollGuard-Setup-<version>.zip via
      # /api/download?format=zip, which reads the version from public/version.json.
      # If this step is ever removed, that link 404s — so it must be built for
      # EVERY release, not added by hand after the fact.
      - name: Zip the installer (blocked-download fallback)
        run: |
          Compress-Archive -Path installer\Output\GnollGuard-Setup.exe `
                           -DestinationPath "installer\Output\GnollGuard-Setup-${{ steps.ver.outputs.version }}.zip" `
                           -CompressionLevel Optimal

      # NOTE: no upload-artifact step — the two build outputs are published to the
      # GitHub Release below (unlimited storage), so a separate Actions artifact would
      # just duplicate them and eat the 0.5 GB Actions-storage quota. Re-add with a
      # short retention-days if you ever need a pre-release debug artifact.

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: Gnoll Guard v${{ steps.ver.outputs.version }}
          files: |
            dist/GnollGuard.exe
            installer/Output/GnollGuard-Setup.exe
            installer/Output/GnollGuard-Setup-${{ steps.ver.outputs.version }}.zip
          body: |
            ## Gnoll Guard v${{ steps.ver.outputs.version }}

            ### Download options

            | File | Description |
            |---|---|
            | **GnollGuard-Setup.exe** | ✅ Recommended — installs to your PC, adds Start Menu + Desktop shortcuts, includes uninstaller |
            | GnollGuard.exe | Portable — run from anywhere, no installation needed |

            A Quest Journal + Item Database companion for EverQuest Legends. It reads
            your game log to tick quest items off your journal as you loot and turn them
            in, and silently helps build the community item database.

            **Requirements:** Windows 10 / 11 (64-bit). Nothing else to install.
